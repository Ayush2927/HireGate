name: HireGate Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/hiregate_test"
  AUTH_SECRET: "ci-test-secret-must-be-at-least-32-chars-long"
  COLLEGE_EMAIL_DOMAIN: "college.edu"

jobs:
  # ===========================================================================
  # JOB 1: CODE QUALITY & TYPE SAFETY (Parallel Worker 1)
  # ===========================================================================
  code-quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  # ===========================================================================
  # JOB 2: TEST SUITE & COVERAGE (Parallel Worker 2)
  # ===========================================================================
  unit-tests:
    name: Vitest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Vitest Unit Tests (Rules Engine + RBAC)
        run: npm run test

  # ===========================================================================
  # JOB 3: DATABASE SCHEMA INTEGRITY (Parallel Worker 3)
  # ===========================================================================
  schema-check:
    name: Database Schema & Migration Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify Drizzle Schema Integrity
        run: npx drizzle-kit generate --check || true

  # ===========================================================================
  # JOB 4: PRODUCTION BUILD VERIFICATION (Runs after quality checks pass)
  # ===========================================================================
  production-build:
    name: Next.js Production Build
    needs: [code-quality, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js Application
        run: npm run build

